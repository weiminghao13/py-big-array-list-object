name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 同分支并发 push 时取消旧 run，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Windows 单跑一条，验证多进程 pickle 在 win 上也能跑（spawn 语义不同）
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check bigarraylist tests examples

      - name: Ruff format check
        run: ruff format --check bigarraylist tests examples

      - name: Mypy strict
        run: mypy bigarraylist

      - name: Pytest with coverage
        run: pytest tests --cov=bigarraylist --cov-report=xml --cov-report=term-missing --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: bigarraylist-coverage
