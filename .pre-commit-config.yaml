# See https://pre-commit.com for hook docs.
# 仅配置 ruff（格式化 + Lint），提交前自动跑、保证烂代码进不了仓库。
# mypy 暂不进 pre-commit：当前还有 13 条类型设计缺口待清理，跑起来会阻塞所有提交；
# 待 Generic[T] + 参数标注补全、mypy 全绿后再加入（见 pyproject.toml [tool.mypy] 注释）。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
